<div class="message flex-self-stretch bolt-messagecard bolt-card flex-column depth-8 bolt-card-white" style="display: none"
     data-bind="class: classes, visible: text().length">
    <!-- ko if: text().length -->
    <div class="bolt-messagebar" data-bind="css: { 'severity-info': severity() === 'info', 'severity-warning': severity() === 'warning', 'severity-error': severity() === 'error' }">
        <div class="bolt-breakpoint relative">
            <div class="bolt-breakpoint-container absolute-fill scroll-hidden">
                <div class="bolt-breakpoint-observation absolute"></div>
            </div>
        </div>
        <div class="bolt-messagebar-content flex-grow flex-row">
            <div class="flex-row">
                <div class="bolt-messagebar-icons flex-row">
                    <span class="fluent-icons-enabled">
                        <span class="bolt-messagebar-icon medium flex-noshrink fabric-icon" data-bind="css: { 'ms-Icon--Info': severity() === 'info', 'ms-Icon--Warning': severity() === 'warning', 'ms-Icon--ErrorBadge': severity() === 'error' }"></span>
                    </span>
                </div>
                <div class="bolt-messagebar-message flex-row flex-wrap flex-grow flex-shrink flex-center body-m word-break"
                     data-bind="text: text"></div>
            </div>
            <div class="bolt-messagebar-buttons flex-noshrink flex-row flex-center flex-self-stretch">
                <button class="bolt-messagebar-close-button bolt-button bolt-icon-button enabled subtle icon-only bolt-focus-treatment" role="button" tabindex="0" type="button" title="Dismiss message"
                        data-bind="click: () => text('')">
                    <span class="fluent-icons-enabled">
                        <span class="left-icon flex-noshrink fabric-icon ms-Icon--Cancel medium"></span>
                    </span>
                </button>
            </div>
        </div>
    </div>
    <!-- /ko -->
</div>
